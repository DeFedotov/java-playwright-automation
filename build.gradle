plugins {
    id 'java'
    id("io.qameta.allure") version "4.3.0"
}

group = 'fiadotau'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.microsoft.playwright:playwright:1.64.0'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
//    testImplementation 'org.seleniumhq.selenium:selenium-java:4.45.0'
    testImplementation 'org.aeonbits.owner:owner:1.0.4'
    testImplementation 'org.assertj:assertj-core:3.27.7'
}

test {
    useJUnitPlatform()
    systemProperties System.properties
}